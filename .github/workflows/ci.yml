name: SiteForge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    # Full verification takes about 30 minutes on hosted macOS. Leave bounded
    # headroom for build variance and failure-artifact upload; XCTest waits
    # and assertions are unchanged.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Record macOS verification environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
      - name: Verify
        env:
          SITEFORGE_DERIVED_DATA: ${{ runner.temp }}/SiteForge/DerivedData
        run: |
          mkdir -p "$RUNNER_TEMP/siteforge-ci"
          set -o pipefail
          ./sf verify 2>&1 | tee "$RUNNER_TEMP/siteforge-ci/verify.log"
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: siteforge-verify-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/siteforge-ci/verify.log
            ${{ runner.temp }}/SiteForge/DerivedData/Logs/Test/*.xcresult
            ${{ runner.temp }}/SiteForge/TestResults/*.xcresult
            ${{ runner.temp }}/SiteForge/TestResults/*.log
          if-no-files-found: warn
          retention-days: 7
